name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # from release.yml: a version is released only if all tests pass

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          for target in windows/amd64 darwin/arm64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/fbrescue
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - run: golangci-lint run ./...

  corpus:
    # Tests against databases created by real Firebird 2.5, 3.0, 4.0 and 5.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install libraries needed by the Firebird release builds
        run: sudo apt-get update && sudo apt-get install -y libtommath1 libncurses6
      - uses: actions/cache@v6
        with:
          path: ~/.cache/fbrescue/firebird
          key: firebird-${{ hashFiles('tools/mkcorpus/mkcorpus.sh') }}
      - run: bash tools/mkcorpus/mkcorpus.sh corpus
      - run: go test -v ./...
        env:
          FBRESCUE_CORPUS: ${{ github.workspace }}/corpus
      - name: Fuzz parsers
        run: |
          for pkg in ./internal/fdb ./internal/record ./internal/scan; do
            go test "$pkg" -run='^$' -fuzz=. -fuzztime=60s
          done
        env:
          FBRESCUE_CORPUS: ${{ github.workspace }}/corpus
