# Builds the site in docs/ (Jekyll) on every change to it, and deploys it
# to GitHub Pages from main: https://formeo.github.io/fbrescue/
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check the site
        run: python3 tools/site/check.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Bing (which ChatGPT search uses) and Yandex learn about new and changed
      # pages right away instead of on their next crawl. The key file is
      # docs/<key>.txt; it covers every URL under /fbrescue/.
      - name: Submit the pages to IndexNow
        continue-on-error: true
        env:
          KEY: 19d7431d83deb1bdc6d69bfff9db4e51
          SITE: https://formeo.github.io/fbrescue
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -Rsc 'split("\n") | map(select(. != ""))')
          jq -n --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: "formeo.github.io", key: $key, keyLocation: $loc, urlList: $urls}' |
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -w 'IndexNow: HTTP %{http_code}\n'
