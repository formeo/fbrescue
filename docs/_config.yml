# GitHub Pages site: https://formeo.github.io/fbrescue/
# Built and deployed by .github/workflows/pages.yml.
title: fbrescue
description: Read-only data recovery for corrupted Firebird 2.5–5.0 databases. Gets the data out of databases that gbak cannot back up, without the Firebird engine.
url: https://formeo.github.io
baseurl: /fbrescue
lang: en
languages: [en, ru, pt-BR] # see _data/i18n.yml
goatcounter: fbrescue # https://fbrescue.goatcounter.com
author: formeo
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - format.md # developer notes, read on GitHub
defaults:
  - scope:
      path: ""
    values:
      layout: default
      locale: en_US
      image: /assets/og.png
  - scope:
      path: "ru"
    values:
      locale: ru_RU
      image: /assets/og-ru.png
  - scope:
      path: "pt"
    values:
      locale: pt_BR
      image: /assets/og-pt.png
  - scope:
      path: "googlec556762a732d5bd7.html" # Search Console ownership file
    values:
      sitemap: false
